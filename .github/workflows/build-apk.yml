name: Build Line Manager APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java --version

      - name: Generate Android project files
        shell: bash
        run: |
          set -euo pipefail
          SCAFFOLD="$RUNNER_TEMP/line_manager_android_scaffold"
          rm -rf "$SCAFFOLD"
          flutter create \
            --platforms=android \
            --org com.infinitymen2 \
            --project-name line_manager \
            "$SCAFFOLD"

          test -d "$SCAFFOLD/android"
          rm -rf android
          cp -R "$SCAFFOLD/android" ./android

          cp build_support/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/raw
          cp build_support/keep.xml android/app/src/main/res/raw/keep.xml

      - name: Configure Android notification compatibility
        run: python3 tools/configure_android_gradle.py

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run unit tests
        run: flutter test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: line-manager-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
