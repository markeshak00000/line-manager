
name: line_manager
description: "إدارة خطوط العملاء - Line Manager - إدارة خطوط Orange والاشتراكات والمدفوعات"
publish_to: 'none'

version: 1.0.1+2

# ==================================================
# SDK REQUIREMENTS
# ==================================================

environment:
  sdk: '^3.14.0'
  flutter: '>=3.50.0'

# ==================================================
# APPLICATION DEPENDENCIES
# ==================================================

dependencies:

  # Flutter
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Localization and formatting
  intl: ^0.20.2

  # State management
  provider: ^6.1.2

  # Local database
  drift: ^2.20.0
  drift_flutter: ^0.2.5
  sqlite3_flutter_libs: ^0.5.0

  # File system
  path_provider: ^2.1.2
  path: ^1.9.0
  file_picker: ^8.1.0

  # Unique IDs
  uuid: ^4.5.0

  # Cloud database and synchronization
  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # PDF and Excel reports
  pdf: ^3.11.0
  excel: ^4.0.6

  # Image processing
  image: ^4.3.0

  # Sharing and external links
  share_plus: ^10.1.4
  url_launcher: ^6.3.0

  # Local application settings
  shared_preferences: ^2.3.0

# ==================================================
# DEVELOPMENT DEPENDENCIES
# ==================================================

dev_dependencies:

  # Flutter testing
  flutter_test:
    sdk: flutter

  # Code quality
  flutter_lints: ^4.0.0

  # Drift database code generation
  drift_dev: ^2.20.0

  # Build runner
  build_runner: ^2.4.13

# ==================================================
# FLUTTER CONFIGURATION
# ==================================================

flutter:

  # Material Design icons
  uses-material-design: true
